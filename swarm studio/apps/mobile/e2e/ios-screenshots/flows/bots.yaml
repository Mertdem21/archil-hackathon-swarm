appId: com.swarmstudio.app
name: Bots
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      SWARM_STUDIO_ACTIVE_EMAIL: ${SWARM_STUDIO_SCREENSHOT_EMAIL}
- openLink: "swarmstudio:///bot-profile?botId=${SWARM_STUDIO_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: ".*Routines.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-bot-profile
- tapOn: ".*Routines.*"
- extendedWaitUntil:
    visible: ".*Weekly fixture review.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-routines
- openLink: "swarmstudio:///bot-model?botId=${SWARM_STUDIO_SCREENSHOT_BOT_ID}"
- extendedWaitUntil:
    visible: ".*Space default.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-bot-model
- openLink: "swarmstudio:///peer-chat?botId=${SWARM_STUDIO_SCREENSHOT_BOT_ID}&botName=Researcher&peerBotId=${SWARM_STUDIO_SCREENSHOT_PEER_BOT_ID}&peerBotName=Writer"
- extendedWaitUntil:
    visible: ".*draft the announcement.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-peer-chat
- openLink: "swarmstudio:///routine?botId=${SWARM_STUDIO_SCREENSHOT_BOT_ID}&botName=Researcher"
- extendedWaitUntil:
    visible: "Add schedule"
    timeout: 15000
- tapOn: "Add schedule"
- extendedWaitUntil:
    visible: ".*How often.*"
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05-new-routine
