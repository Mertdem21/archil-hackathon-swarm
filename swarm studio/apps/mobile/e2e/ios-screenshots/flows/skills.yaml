appId: com.swarmstudio.app
name: Skills
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      SWARM_STUDIO_ACTIVE_EMAIL: ${SWARM_STUDIO_SCREENSHOT_EMAIL}
- openLink: "swarmstudio:///skills"
- extendedWaitUntil:
    visible: ".*Review Kit.*"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-skills
- tapOn: "Swarm Studio"
- extendedWaitUntil:
    visible: ".*name: Swarm Studio.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-skill
- tapOn: "Back"
- tapOn: ".*New skill.*"
- extendedWaitUntil:
    visible: "Save"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-new-skill
- openLink: "swarmstudio:///skills"
- tapOn: ".*Review Kit.*"
- extendedWaitUntil:
    visible: ".*Install.*|.*Add.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-plugin
- openLink: "swarmstudio:///bot-templates"
- extendedWaitUntil:
    visible: "Morning briefing"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05-bot-templates
- tapOn: "Morning briefing"
- extendedWaitUntil:
    visible: "Create bot"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 06-bot-template
